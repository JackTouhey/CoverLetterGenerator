<style>
  
</style>

<main class="main">
  <div class="col-12 d-flex flex-row justify-content-center">
    <div class="d-flex flex-column col-11 justify-content-center border border-secondary-subtle">
      <div class="col-10 d-flex flex-row justify-content-center mx-auto">
        <label for="upload" class="me-1">Upload Files: </label>
        <input id="upload" type="file" class="file-upload border border-black rounded" (change)="uploadFile($event)">
      </div>
      

      <br/>

      <ul>
          @for (file of files; track file.id) {
            <li class="col-3 d-flex justify-content-start border border-black rounded mt-2" (click)="selectCoverLetter(file.id)">
                @if (selectedFiles.includes(file.id)) {
                  <i class="fa-solid fa-circle my-auto"></i>
                } @else {
                  <i class="fa-regular fa-circle my-auto"></i>
                }
                <div class="d-flex justify-content-between">
                  {{file.id}}. {{file.name}}
                </div>
            </li>
          }
      </ul>
      
      <br/>
      
      <button (click)="generateCoverLetter()" class="border border-black rounded">Generate Cover Letter</button>

    </div>
  </div>
  
  
</main>

<router-outlet />
