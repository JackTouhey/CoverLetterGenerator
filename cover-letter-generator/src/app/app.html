<style>
  
</style>

<main class="main">
  <!-- <button (click)="generateCoverLetter()">Generate Cover Letter</button> -->
  <button (click)="testConnection()">Test DB connection</button><br/>
  
  <input type="file" class="file-upload" (change)="uploadFile($event)">

  <br/>

  <ul>
      @for (file of files; track file.id) {
        <li class="col-3 d-flex justify-content-start border border-black rounded mt-2" (click)="selectCoverLetter(file.id)">
            @if (selectedFiles.includes(file.id)) {
              <i class="fa-solid fa-circle"></i>
            } @else {
              <i class="fa-regular fa-circle"></i>
            }
            <div class="d-flex justify-content-between">
              {{file.id}}. {{file.name}}
            </div>
        </li>
      }
  </ul>
  
  <br/>
  
  <button (click)="generateCoverLetter()">Generate Cover Letter</button>
</main>

<router-outlet />
